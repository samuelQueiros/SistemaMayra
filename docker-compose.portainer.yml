# Stack para o Portainer (Stacks > Add stack). Ver DEPLOY.md seção 3.2.
#
# Diferenças em relação ao docker-compose.yml (VPS "crua", sem Portainer):
#   - Usa a imagem pronta publicada no GHCR pelo GitHub Actions
#     (.github/workflows/docker-publish.yml) em vez de "build: .", então
#     funciona tanto colando no Web editor quanto via Repository.
#   - Não usa env_file nem bind mount de arquivos do repositório (o
#     Portainer não tem esses arquivos). Todas as variáveis vêm da seção
#     "Environment variables" da stack (dá pra carregar o
#     portainer.env.example com "Load variables from .env file"), e o
#     Caddy é configurado pela linha de comando em vez do Caddyfile.
#
# Obrigatórias: POSTGRES_PASSWORD, JWT_SECRET e DOMAIN (com o DNS do
# domínio já apontando para a VPS, e as portas 80/443 livres).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formpsico
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD nas variáveis da stack}"
      POSTGRES_DB: formpsico
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formpsico"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: "${APP_IMAGE:-ghcr.io/samuelqueiros/psicologa:latest}"
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: "postgresql+psycopg://formpsico:${POSTGRES_PASSWORD}@db:5432/formpsico"
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET nas variáveis da stack}"
      # Login da psicóloga, criado/atualizado a cada start (app/seed_admin.py).
      ADMIN_NAME: "${ADMIN_NAME:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRES_MINUTES: "${JWT_EXPIRES_MINUTES:-1440}"
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-5}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
    volumes:
      - app_storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # HTTPS automático (Let's Encrypt) para DOMAIN, repassando para o app.
    # Mesmo papel do Caddyfile do docker-compose.yml, sem precisar do arquivo.
    command:
      - caddy
      - reverse-proxy
      - --from
      - "${DOMAIN:?defina DOMAIN nas variáveis da stack, ex: laudos.suaclinica.com.br}"
      - --to
      - app:8000
      - --header-down
      - "Strict-Transport-Security: max-age=31536000; includeSubDomains"
      - --header-down
      - "X-Content-Type-Options: nosniff"
      - --header-down
      - "X-Frame-Options: DENY"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:
